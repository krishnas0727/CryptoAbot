  <line x1="32" y1="10" x2="32" y2="54" stroke="url(#globeGrad)" stroke-width="1.5" opacity="0.5"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="url(#globeGrad)" stroke-width="1.5" opacity="0.5"/>

  <path d="M 32,8 A 24,24 0 0,1 56,32" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="56,32 52,26 60,26" fill="#38bdf8"/>

  <path d="M 32,56 A 24,24 0 0,1 8,32" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
